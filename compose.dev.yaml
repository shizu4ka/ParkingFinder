services:
  db:
    image: postgres:18-alpine
    container_name: parkingpostgres-dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parking_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      
  parkingfinderbackend:
    image: parkingfinderbackend:dev
    container_name: parkingfinderbackend-dev
    build:
      context: .
      dockerfile: ParkingFinder/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Path inside the container; the host credentials file is bind-mounted read-only below.
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=parking_db;Username=postgres;Password=postgres

volumes:
  pgdata:
